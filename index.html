<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Q4 SkillsTest1</title>
     
     <link rel="stylesheet" href="styles.css">

     <!-- BOOTSTRAP -->
     <!-- Latest compiled and minified CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

     <!-- Latest compiled JavaScript -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

     <!-- GOOGLE FONTS -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

</head>
<body>
     
     <form>
          <div class="container">
               <img src="logo.png" alt="logo" width="50px" height="50px" class="center">
               <h1>Login</h1>

               <!-- USERNAME -->
               <div id="usernamePart">
                    <label style="margin-bottom: 5px;">Username</label>
                    <input type="text" id="usernameEnter" placeholder="Enter username" class="form-control mx-auto" min="0">
               </div>

               <!-- PASSWORD -->
               <div id="passwordPart">
                    <label style="margin-bottom: 5px;">Password</label>
                    <input type="password" id="passwordEnter" placeholder="Enter password" class="form-control mx-auto" min="0">
               </div>

               <!-- CHECKBOX -->
               <div id="checkPart">
                    <input type="checkbox" name="stay-logged-in" value="stay-logged-in">
                    <label>Stay logged in</label><br> 
               </div>

               <!-- BUTTONS -->
               <div id="theBtns">
                    <button onclick="loginNow()" type="button" class="btn btn-primary mt-3">Submit</button>
                    <button type="button" class="btn btn-primary mt-3" onclick="window.location.reload()">Cancel</button>
               </div> <hr>

               <!-- FORGOT -->
               <div id="forgotIt">
                    <a href="" target="_self" style="text-align: center;">Forgot username/password</a>
               </div>

          </div>
     </form>

     <script src="main.js"></script>

</body>
</html>
